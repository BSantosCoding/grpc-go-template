# docker-compose.yml
version: '3.8'

services:
  # Go Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development # <-- Target the development stage by default
    container_name: grpc_app_server_dev # Optional: Keep dev name or change back
    volumes: # <-- Mount host source code for hot-reloading
      - .:/app
    ports:
      - '50051:50051'
    env_file:
      - .env
    environment:
      PGHOST: db # Connect to the db service name
      # Construct DATABASE_URL using variables loaded from .env
      DATABASE_URL: postgresql://${PGUSER}:${PGPASSWORD}@db:5432/${DBNAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    # Explicitly run air (relies on CMD in the development stage of Dockerfile)
    command: ['air']
    restart: unless-stopped

  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: grpc_postgres_db
    ports:
      - '5432:5432'
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${DBNAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGUSER} -d ${DBNAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  # Optional: Define named volume for caching
  # go-build-cache:
